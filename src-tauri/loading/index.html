<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeshiA</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #0b0d10;
        color: #f5f7fa;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        background: #4da3ff;
        box-shadow: 0 0 0 4px rgba(77, 163, 255, 0.14);
      }
      .spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #252b33;
        border-top-color: #4da3ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #msg {
        color: #7d8792;
        font-size: 13px;
        max-width: 30rem;
        text-align: center;
        padding: 0 24px;
        line-height: 1.5;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="mark"><span class="dot"></span>DeshiA</div>
    <div class="spinner" role="status" aria-label="Starting"></div>
    <div id="msg">Starting the annotation workstation…</div>
  </body>
</html>
